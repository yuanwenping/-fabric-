version: "2.1"

volumes:
  orderer.example.com:
  peer0.supplier.example.com:
  peer0.processor.example.com:
  peer0.logistics.example.com:
  peer0.retailer.example.com:

networks:
  trace4:
    name: trace4_test

x-peer-environment: &peer-environment
  CORE_VM_ENDPOINT: unix:///host/var/run/docker.sock
  CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE: trace4_test
  FABRIC_LOGGING_SPEC: INFO
  CORE_PEER_TLS_ENABLED: "true"
  CORE_PEER_PROFILE_ENABLED: "true"
  CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/fabric/tls/server.crt
  CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/fabric/tls/server.key
  CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/fabric/tls/ca.crt

services:
  orderer.example.com:
    container_name: orderer.example.com
    image: hyperledger/fabric-orderer:${IMAGE_TAG:-2.2.15}
    restart: unless-stopped
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_GENESISMETHOD=file
      - ORDERER_GENERAL_GENESISFILE=/var/hyperledger/orderer/genesis.block
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric
    command: orderer
    volumes:
      - ../channel-artifacts/genesis.block:/var/hyperledger/orderer/genesis.block
      - ../organizations/ordererOrganizations/example.com/orderers/orderer.example.com/msp:/var/hyperledger/orderer/msp
      - ../organizations/ordererOrganizations/example.com/orderers/orderer.example.com/tls:/var/hyperledger/orderer/tls
      - orderer.example.com:/var/hyperledger/production/orderer
    ports:
      - "7050:7050"
    networks:
      - trace4

  peer0.supplier.example.com:
    container_name: peer0.supplier.example.com
    image: hyperledger/fabric-peer:${IMAGE_TAG:-2.2.15}
    restart: unless-stopped
    environment:
      <<: *peer-environment
      CORE_PEER_ID: peer0.supplier.example.com
      CORE_PEER_ADDRESS: peer0.supplier.example.com:7051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:7051
      CORE_PEER_CHAINCODEADDRESS: peer0.supplier.example.com:7052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:7052
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.supplier.example.com:7051
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.supplier.example.com:7051
      CORE_PEER_LOCALMSPID: SupplierMSP
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/supplier.example.com/peers/peer0.supplier.example.com/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/supplier.example.com/peers/peer0.supplier.example.com/tls:/etc/hyperledger/fabric/tls
      - peer0.supplier.example.com:/var/hyperledger/production
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    ports:
      - "7051:7051"
    networks:
      - trace4

  peer0.processor.example.com:
    container_name: peer0.processor.example.com
    image: hyperledger/fabric-peer:${IMAGE_TAG:-2.2.15}
    restart: unless-stopped
    environment:
      <<: *peer-environment
      CORE_PEER_ID: peer0.processor.example.com
      CORE_PEER_ADDRESS: peer0.processor.example.com:8051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:8051
      CORE_PEER_CHAINCODEADDRESS: peer0.processor.example.com:8052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:8052
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.processor.example.com:8051
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.processor.example.com:8051
      CORE_PEER_LOCALMSPID: ProcessorMSP
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/processor.example.com/peers/peer0.processor.example.com/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/processor.example.com/peers/peer0.processor.example.com/tls:/etc/hyperledger/fabric/tls
      - peer0.processor.example.com:/var/hyperledger/production
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    ports:
      - "8051:8051"
    networks:
      - trace4

  peer0.logistics.example.com:
    container_name: peer0.logistics.example.com
    image: hyperledger/fabric-peer:${IMAGE_TAG:-2.2.15}
    restart: unless-stopped
    environment:
      <<: *peer-environment
      CORE_PEER_ID: peer0.logistics.example.com
      CORE_PEER_ADDRESS: peer0.logistics.example.com:9051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:9051
      CORE_PEER_CHAINCODEADDRESS: peer0.logistics.example.com:9052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:9052
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.logistics.example.com:9051
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.logistics.example.com:9051
      CORE_PEER_LOCALMSPID: LogisticsMSP
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/logistics.example.com/peers/peer0.logistics.example.com/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/logistics.example.com/peers/peer0.logistics.example.com/tls:/etc/hyperledger/fabric/tls
      - peer0.logistics.example.com:/var/hyperledger/production
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    ports:
      - "9051:9051"
    networks:
      - trace4

  peer0.retailer.example.com:
    container_name: peer0.retailer.example.com
    image: hyperledger/fabric-peer:${IMAGE_TAG:-2.2.15}
    restart: unless-stopped
    environment:
      <<: *peer-environment
      CORE_PEER_ID: peer0.retailer.example.com
      CORE_PEER_ADDRESS: peer0.retailer.example.com:10051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:10051
      CORE_PEER_CHAINCODEADDRESS: peer0.retailer.example.com:10052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:10052
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.retailer.example.com:10051
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.retailer.example.com:10051
      CORE_PEER_LOCALMSPID: RetailerMSP
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/retailer.example.com/peers/peer0.retailer.example.com/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/retailer.example.com/peers/peer0.retailer.example.com/tls:/etc/hyperledger/fabric/tls
      - peer0.retailer.example.com:/var/hyperledger/production
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    ports:
      - "10051:10051"
    networks:
      - trace4

  cli:
    container_name: trace4-cli
    image: hyperledger/fabric-tools:${IMAGE_TAG:-2.2.15}
    restart: unless-stopped
    environment:
      - GOPATH=/opt/gopath
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - FABRIC_LOGGING_SPEC=INFO
      - FABRIC_CFG_PATH=/etc/hyperledger/fabric
    working_dir: /work
    command: /bin/bash
    tty: true
    volumes:
      - /var/run/:/host/var/run/
      - ../:/work
    depends_on:
      - peer0.supplier.example.com
      - peer0.processor.example.com
      - peer0.logistics.example.com
      - peer0.retailer.example.com
    networks:
      - trace4
