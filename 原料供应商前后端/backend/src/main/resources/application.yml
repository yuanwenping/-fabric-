server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: supplier-duck-trace
  datasource:
    url: ${DB_URL:jdbc:mysql://192.168.116.1:3306/changde_trace_multipeer?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:supplier_app}
    password: ${DB_PASSWORD:Yuan15347361610}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 120MB
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

app:
  node:
    org-code: ${NODE_ORG_CODE:SUP003}
  jwt-secret: ${JWT_SECRET:ChangdeDuckTrace2027SecretMustBeAtLeast32BytesLong}
  jwt-expire-hours: 12
  upload-dir: ${UPLOAD_DIR:./uploads}
  cors-origin: ${CORS_ORIGIN:http://192.168.116.145:5173,http://localhost:5173,http://127.0.0.1:5173}

fabric:
  enabled: ${FABRIC_ENABLED:true}
  channel: ${FABRIC_CHANNEL:tracechannel}
  chaincode: ${FABRIC_CHAINCODE:tracecc}
  endpoint: ${FABRIC_PEER_ENDPOINT:grpcs://192.168.116.144:7051}
  endpoint-orderer: ${FABRIC_ORDERER_ENDPOINT:grpcs://192.168.116.144:7050}
  msp-id: ${FABRIC_MSP_ID:SupplierMSP}
  peer-authority: ${FABRIC_PEER_AUTHORITY:peer0.supplier.example.com}
  orderer-authority: ${FABRIC_ORDERER_AUTHORITY:orderer.example.com}
  client-cert: ${FABRIC_CLIENT_CERT:file:./certs/supplier-cert.pem}
  client-key: ${FABRIC_CLIENT_KEY:file:./certs/supplier-key.pem}
  peer-tls: ${FABRIC_PEER_TLS:file:./certs/supplier-tls-ca.pem}
  orderer-tls: ${FABRIC_ORDERER_TLS:file:./certs/orderer-tls-ca.pem}

management:
  endpoints:
    web:
      exposure:
        include: health,info
